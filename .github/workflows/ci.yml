name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite must pass with no credentials present. If any test needs a
      # key, the collection/scoring separation has been broken somewhere.
      - name: Run tests with a scrubbed environment
        env:
          BASETEN_API_KEY: ""
          TOGETHER_API_KEY: ""
          FIREWORKS_API_KEY: ""
          OPENAI_API_KEY: ""
        run: pytest -q

      - name: Verify no credential-shaped strings are committed
        run: |
          if grep -rInE '(sk-[a-zA-Z0-9]{16,}|api[_-]?key\s*=\s*["'"'"'][a-zA-Z0-9]{16,})' \
               --include='*.py' --include='*.md' --include='*.toml' --include='*.yml' .; then
            echo "::error::possible hardcoded credential"
            exit 1
          fi
          echo "clean"
